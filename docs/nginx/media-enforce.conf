# STEP 3 - LAST. Refuse unsigned requests for video files.
# Only add after the app is deployed with MEDIA_SIGNING_SECRET and web + mobile are confirmed
# playing signed URLs (docs/media-signing.md). Install as
# /etc/nginx/snippets/nolimitflix-media-enforce.conf and include it next to the step 1 snippet.
# Posters and thumbnails are untouched; they still fall through to `location /media/`.

location ~* ^/media/.+\.(?:mp4|mkv|webm|mov|m3u8|ts|m4s)$ {
    return 403;
}
