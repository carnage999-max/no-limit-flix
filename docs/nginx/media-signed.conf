# STEP 2 - accept signed video URLs (add after the new frontend is deployed; see docs/media-signing.md).
# Install as /etc/nginx/snippets/nolimitflix-media-signed.conf and include it inside the
# nolimitflix.com `server { }` block, above `location /media/`.
#
# Uses only the stock auth_request module: nginx asks the app (/api/media-auth) whether the
# signature in the URL is valid and unexpired. No secret lives in nginx, and no cookie or login
# is involved, so players that send no cookies (the mobile app) work unchanged.
#
# URL shape: /media/s/<expires>/<signature>/<path>

location = /_media_auth {
    internal;
    proxy_pass http://localhost:3001/api/media-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Original-URI $request_uri;
}

location ~ ^/media/s/[0-9]+/[A-Za-z0-9_-]+/(?<path>.+)$ {
    auth_request /_media_auth;

    alias /mnt/data/media/no-limit-flix/$path;
    sendfile on;
    tcp_nopush on;
    add_header Cache-Control "private, max-age=3600";
}
