# STEP 1 - accept signed video URLs (safe to add before anything else changes).
# Install as /etc/nginx/snippets/nolimitflix-media-signed.conf and include it inside the
# nolimitflix.com `server { }` block (see docs/media-signing.md). Needs a sibling file defining the
# secret: /etc/nginx/nolimitflix-media-secret.conf containing
#     set $media_secret "<same value as the app's MEDIA_SIGNING_SECRET>";
# and nginx built with ngx_http_secure_link_module (nginx -V 2>&1 | grep secure_link).
#
# URL shape: /media/s/<expires>/<signature>/<path>
#   - HLS (.m3u8/.ts/.m4s): signature covers the playlist's folder, so segments inherit it
#   - single files (.mp4/.mkv/.webm/.mov): signature covers exactly that file

location ~ ^/media/s/(?<exp>[0-9]+)/(?<sig>[A-Za-z0-9_-]+)/(?<dir>.+)/(?<file>[^/]+\.(?:m3u8|ts|m4s))$ {
    secure_link $sig,$exp;
    secure_link_md5 "$exp/$dir $media_secret";
    if ($secure_link = "")  { return 403; }
    if ($secure_link = "0") { return 410; }

    alias /mnt/data/media/no-limit-flix/$dir/$file;
    sendfile on;
    tcp_nopush on;
    add_header Cache-Control "private, max-age=3600";
}

location ~ ^/media/s/(?<exp>[0-9]+)/(?<sig>[A-Za-z0-9_-]+)/(?<path>.+\.(?:mp4|mkv|webm|mov))$ {
    secure_link $sig,$exp;
    secure_link_md5 "$exp/$path $media_secret";
    if ($secure_link = "")  { return 403; }
    if ($secure_link = "0") { return 410; }

    alias /mnt/data/media/no-limit-flix/$path;
    sendfile on;
    tcp_nopush on;
    add_header Cache-Control "private, max-age=3600";
}
